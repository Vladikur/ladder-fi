name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The SSH_PRIVATE_KEY's authorized_keys entry on the server forces
      # /opt/ladderfi/deploy.sh regardless of what's sent here (git pull,
      # npm ci, npm run build, restart the ladderfi systemd service).
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: exit 0
